name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Catches a `files` mistake before it reaches a publish, where it is permanent.
      - name: The tarball is the file set we expect
        run: |
          npm pack --dry-run --json | node -e '
            const [tarball] = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const shipped = tarball.files.map((f) => f.path).sort();
            console.log("shipping:", shipped.join(", "));
            const expected = ["LICENSE", "README.md", "extensions/jefferson.ts", "package.json"];
            if (JSON.stringify(shipped) !== JSON.stringify(expected)) {
              console.error("tarball contents changed; update the expectation deliberately");
              process.exit(1);
            }
          '
