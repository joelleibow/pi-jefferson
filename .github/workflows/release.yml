name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write creates the tag and the GitHub Release.
# id-token: write is the whole of the npm authentication. Trusted publishing exchanges it
# for a short-lived credential, so no token exists anywhere.
permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, because the version base is the highest release tag reachable
          # from this commit's parent.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # No package-manager cache here. This workflow decides what reaches the registry and
      # a published tarball is permanent, so nothing restored from a cache should be able
      # to influence it.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      # Self-gating: a push to main is what triggers this, and a red merge must not publish.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # The bump comes from the pull request's labels: release:major, release:minor or
      # release:patch. Anything else, including no label at all, is a patch. Labelling is
      # the one judgement this cannot make for you, and a missing label under-bumps rather
      # than over-bumps on purpose.
      - name: Work out the bump
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                     --jq '.[0].labels[].name' 2>/dev/null || true)
          if grep -qx "release:major" <<<"$labels"; then bump=major
          elif grep -qx "release:minor" <<<"$labels"; then bump=minor
          else bump=patch
          fi
          echo "labels seen: ${labels:-none}"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Work out the version
        id: v
        run: |
          set -euo pipefail
          version=$(node .github/scripts/next-version.mjs "${{ steps.bump.outputs.bump }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bump=${{ steps.bump.outputs.bump }} -> $version"

      # `pnpm publish` publishes the version in package.json, not the version computed
      # above. Without this the tarball and the tag disagree. `pnpm version` is used rather
      # than `npm version` because npm would write a package-lock.json back into the tree.
      - name: Apply the version to the manifest
        run: pnpm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version

      # A re-run whose publish already succeeded finishes the tag and the release instead
      # of failing on a version npm will never accept twice.
      - name: Is that version already on the registry?
        id: published
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          if pnpm view "$name@${{ steps.v.outputs.version }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # `publishConfig.provenance` is true, and that is also why this command only works
      # here: provenance is signed from a CI OIDC provider, so the identical command on a
      # workstation fails before it reaches the registry. No provenance flag is passed;
      # under trusted publishing pnpm attaches the attestation itself.
      #
      # `--no-git-checks` is required: `pnpm version` above has just dirtied the working
      # tree, so `pnpm publish` would otherwise refuse.
      - name: Publish
        if: steps.published.outputs.already == 'false'
        run: pnpm publish --tag latest --no-git-checks

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.v.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do"
          else
            gh release create "$tag" \
              --target "${{ github.sha }}" \
              --title "$tag" \
              --generate-notes
          fi
